<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="Agent Essential Skills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)" opacity="0.45"/>
  <circle cx="1320" cy="90" r="160" fill="#38bdf8" opacity="0.08"/>
  <circle cx="1480" cy="320" r="120" fill="#34d399" opacity="0.08"/>
  <rect x="64" y="64" width="8" height="72" rx="4" fill="url(#accent)"/>
  <text x="92" y="98" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="600" letter-spacing="4">AGENT ESSENTIAL SKILLS</text>
  <text x="92" y="178" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="700">One install. Ten tools.</text>
  <text x="92" y="248" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="30">Give native agents real context  memory, docs, codebase map, browser, and more.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#cbd5e1">
    <rect x="92" y="300" width="150" height="44" rx="22" fill="#0ea5e9" opacity="0.15" stroke="#38bdf8"/>
    <text x="122" y="328">Cursor</text>
    <rect x="262" y="300" width="180" height="44" rx="22" fill="#10b981" opacity="0.12" stroke="#34d399"/>
    <text x="292" y="328">Claude Code</text>
    <rect x="462" y="300" width="120" height="44" rx="22" fill="#64748b" opacity="0.18" stroke="#94a3b8"/>
    <text x="492" y="328">MIT</text>
  </g>
</svg>
